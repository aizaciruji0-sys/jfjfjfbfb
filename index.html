  navigasi: () => { const inp = Array.from(dom.fb.querySelectorAll('[data-col]')).find(i => /alamat|lokasi/i.test(i.dataset.col)), loc = (inp?.value || '').trim(); if (!loc) return msg('koordinat kosong'); window.location.href = 'geo:' + loc + '?q=' + encodeURIComponent(loc); },
  gps: () => { const inp = Array.from(dom.fb.querySelectorAll('[data-col]')).find(i => /alamat|lokasi/i.test(i.dataset.col)); if (!inp) return msg('kolom lokasi/alamat tidak ada'); if (navigator.geolocation) { msg('gps...'); navigator.geolocation.getCurrentPosition(p => { const loc = p.coords.latitude.toFixed(6) + ',' + p.coords.longitude.toFixed(6); inp.value = loc; msg(loc); }, () => msg('gps err'), { enableHighAccuracy: true, timeout: 5000 }); } else msg('no gps'); },
  'sh-sel': el => { S.cur = el.value; S.idx = null; S.v = 'list'; S.page = 1; S.parent = null; S.readyOnly = false; render(); },
  'st-sel': el => { S.sort = el.value === 'near' ? 'near' : (parseInt(el.value, 10) || 0); S.page = 1; render(); },
  'act-sel': el => {
    const a = el.value; el.value = ''; if (!a) return;
    if (a === 'edit') { S.v = S.v === 'edit' ? 'list' : 'edit'; return render(); }
    if (['bulksheet','schema'].includes(a)) { S.v = a; return render(); }
    if (a === 'imp') return dom.f.click();
    if (a === 'tsv') return dl([cols().join('\t')].concat((S.db[S.cur] || []).map(r => r.join('\t'))).join('\r\n'), `${S.cur}_${Date.now()}.tsv`, 'text/tab-separated-values');
    if (a === 'clear') { if (S.conf !== 'clear') { S.conf = 'clear'; msg(`clear ${S.cur}? pilih lagi`); return; } S.db[S.cur] = []; S.conf = null; persist(); msg('ok'); render(); }
  },
  q: el => { if (document.body.dataset.m === 'menu') { const qm = S2(el.value); Array.from(dom.sb.children).forEach(b => b.hidden = Boolean(qm && !b.textContent.toLowerCase().includes(qm))); return; } S.page = 1; render(); },
  f: el => {
    const file = el.files?.[0]; if (!file) return; el.value = ''; const rd = new FileReader();
    rd.onload = e => { const lines = (e.target.result || '').split(/\r?\n/).filter(Boolean); if (!lines.length) return msg('empty'); const c = cols(); S.db[S.cur] = lines.slice(1).map(l => { const r = l.split('\t'); while (r.length < c.length) r.push(''); return r.slice(0, c.length); }); persist(); msg('ok'); render(); };
    rd.readAsText(file);
  }
};
dom.fJson.onchange = e => {
  const file = e.target.files?.[0]; if (!file) return; e.target.value = ''; const rd = new FileReader();
  rd.onload = ev => {
    try {
      const d = JSON.parse(ev.target.result);
      if (d && typeof d === 'object') {
        if (d.store) S.store = d.store; if (d.shs) S.shs = d.shs; if (d.cols) S.cols = d.cols; if (d.vis) S.vis = d.vis; if (d.fvis) S.fvis = d.fvis; if (d.db) S.db = d.db;
        persist(); msg('pull ok'); render();
      }
    } catch (err) { msg('json err'); }
  };
  rd.readAsText(file);
};
document.addEventListener('click', e => {
  const b = e.target.closest('[data-a]');
  if (b) { if (!['del-row','clear-items','act-sel'].includes(b.dataset.a) && S.conf) { S.conf = null; msg(''); } return actions[b.dataset.a]?.(b, e); }
  const r = e.target.closest('#list>[data-idx]');
  if (r && S.v === 'list' && S.idx === null) {
    const idx = parseInt(r.dataset.idx, 10);
    if (S.cur === 'cms') { S.idx = idx; S.v = 'cms_detail'; return render(); }
    if (S.cur === 'produk') {
      const p = S.db.produk[idx] || [], isBeli = S.parent?.type === 'pembelian', pType = isBeli ? 'pembelian' : 'penjualan';
      S.parent = getOpenTrx(pType) || { type: pType, id: genId(), open: true }; S.cur = isBeli ? 'produk_beli' : 'produk_jual';
      S.prefill = { idproduk: p[0], namaproduk: p[3], hargabeli: p[4], hargajual: p[5], qty: '1', diskon: '', catatan: '' }; S.prodIdx = idx; S.idx = -1; S.v = 'form'; return render();
    }
    if (isTrx()) { const pid = S.db[S.cur]?.[idx]?.[0]; if (pid) S.parent = { type: S.cur, id: pid }; }
    S.idx = idx; S.v = 'form'; render();
  }
});
document.addEventListener('input', e => {
  if (e.target.id === 'map-lim') { S.mapLimit = e.target.value; persist(); render(); $('map-lim')?.focus(); return; }
  if (e.target.dataset.df) { const k = e.target.dataset.df; S.df[k] = e.target.value; persist(); const pos = e.target.selectionStart; render(); const nx = dom.db.querySelector(`[data-df="${k}"]`); if (nx) { nx.focus(); if (typeof pos === 'number') try { nx.setSelectionRange(pos, pos); } catch (err) {} } return; }
  if (e.target.dataset.a === 'q') actions.q(e.target);
  if (e.target.dataset.col) updateFormThumb(e.target);
  if (['idproduk','namaproduk'].includes(e.target.dataset.col) && S.cur !== 'produk') {
    const q = S2(e.target.value); if (!q) return;
    const pCols = S.cols.produk || [], pIdI = pCols.indexOf('idproduk'), pNmI = pCols.indexOf('namaproduk');
    const fnd = (S.db.produk || []).find(r => S2(pIdI !== -1 ? r[pIdI] : r[0]) === q || (pNmI !== -1 && S2(r[pNmI]) === q));
    if (fnd) dom.fb.querySelectorAll('[data-col]').forEach(inp => { const fi = pCols.indexOf(inp.dataset.col); if (fi !== -1) inp.value = fnd[fi]; });
  }
});
document.addEventListener('change', e => {
  const a = e.target.dataset.a; if (a && actions[a]) actions[a](e.target);
  if (e.target === dom.fCam || e.target === dom.fImg) {
    const file = e.target.files?.[0]; if (!file) return;
    const inp = Array.from(dom.fb.querySelectorAll('[data-col]')).find(i => /foto/i.test(i.dataset.col)); if (!inp) return msg('kolom foto tidak ada');
    const rd = new FileReader(); msg('memuat foto...');
    rd.onload = ev => { inp.value = ev.target.result || ''; updateFormThumb(inp); msg('foto ok'); };
    rd.onerror = () => msg('gagal baca file'); rd.readAsDataURL(file); e.target.value = '';
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.tagName !== 'TEXTAREA' && dom.fb.contains(e.target)) {
    e.preventDefault();
    if (!S.u) actions.login();
    else if (S.v === 'bulksheet') actions['save-bulksheet']();
    else if (S.v === 'toko') actions['save-store']();
    else if (S.v === 'conn') actions['save-conn']();
    else if (S.v === 'schema') actions['save-schema']();
    else actions['save-row']();
  } else if (e.key === 'Escape') actions.cancel();
});
try {
  const d = JSON.parse(localStorage.getItem(STORE_KEY) || 'null');
  if (d && typeof d === 'object') {
    ['store','shs','cols','vis','fvis','db','parent','cur','u','sid','appurl','d1url','df','mapLimit','curMap'].forEach(k => { if (d[k] !== undefined) S[k] = d[k]; });
    S.grid = Boolean(d.grid);
  }
} catch (e) {}
render();
